{% extends 'base.html' %}

{% block title %}Login - Gas Booking Portal{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<!-- Floating Elements -->
<div class="auth-floating top-left"></div>
<div class="auth-floating bottom-right"></div>

<div class="auth-layout">
    <div class="auth-card" data-aos="zoom-in">
        <!-- Header -->
        <div class="auth-header">
            <a href="{{ url_for('main.landing') }}" class="auth-logo">
                <i class="fas fa-fire-flame-curved"></i>
                <span>Gas<span class="highlight">Book</span></span>
            </a>
            <h1>Welcome Back!</h1>
            <p>Login to your account to continue</p>
        </div>

        <!-- Login Form -->
        <form class="auth-form" method="POST" action="{{ url_for('auth.login') }}">
            <div class="form-group">
                <input type="email" name="email" id="email" placeholder="Email Address" required>
                <i class="fas fa-envelope"></i>
            </div>

            <div class="form-group">
                <input type="password" name="password" id="password" placeholder="Password" required>
                <i class="fas fa-lock"></i>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-full">
                <i class="fas fa-right-to-bracket"></i>
                <span>Login</span>
            </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">or continue with</div>

        <!-- Social Login -->
        <div class="social-auth">
            <a href="#" class="social-btn">
                <i class="fab fa-google"></i>
                <span>Google</span>
            </a>
            <a href="#" class="social-btn">
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
            </a>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('auth.register') }}">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
